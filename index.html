<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffc857;--amber:#ff9a1f;--text:#fff4dc;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:linear-gradient(#070418,#140a30 45%,#2b0f40);color:var(--text);font-family:Poppins,system-ui,sans-serif;overflow:hidden;position:relative}
.serif{font-family:'Playfair Display',Georgia,serif}
#stars i{position:fixed;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.9}}
#moon{position:fixed;top:9%;right:10%;width:46px;height:46px;border-radius:50%;background:#fff6d8;box-shadow:0 0 40px 8px #fff6d855}
#warm{position:fixed;inset:0;background:radial-gradient(circle at 50% 75%,rgba(255,154,31,.5),rgba(255,90,20,.12) 55%,transparent 75%);opacity:0;transition:opacity 2.2s}
body.lit #warm{opacity:1}
#stage{position:absolute;inset:0;width:100%;height:100%}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pulse{animation:pulse 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.1)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .7s}
body.lit .flame{transform:scale(1);animation:fl .18s infinite alternate .7s}
@keyframes fl{to{transform:scale(1.07,.93) rotate(2deg)}}
.win{fill:#2b2350;transition:fill 1.6s}
body.lit .win{fill:#ffc857;filter:drop-shadow(0 0 8px #ffb02088)}
.pt{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.draw .pt{animation:dr 1.6s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#lantern{transform-box:fill-box;transform-origin:center;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#lantern.go{animation:burst .9s forwards}
@keyframes burst{40%{transform:scale(1.4)}100%{transform:scale(3.2);opacity:0}}
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;right:0;text-align:center;z-index:3;transition:opacity .5s;opacity:0}
#top.on{opacity:1}
#hint{font-size:1.3rem;color:var(--gold)}
#sub{font-size:.8rem;opacity:.7;margin-top:2px}
#dots{display:flex;gap:8px;justify-content:center;margin-top:10px}
#dots b{width:26px;height:4px;border-radius:2px;background:#ffffff30;transition:background .5s}
#dots b.d{background:var(--gold)}
.ov{position:fixed;inset:0;z-index:5;overflow-y:auto;display:flex;padding:24px;background:rgba(8,4,22,.62);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity 1.1s}
.ov.show{opacity:1;pointer-events:auto}
.card{margin:auto;text-align:center;max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.eye{letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-size:.75rem}
.big{font-weight:800;font-size:clamp(2.4rem,12vw,4.6rem);line-height:1.1;background:linear-gradient(#fff2b0,#ffb020 60%,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,150,30,.55))}
.msg{opacity:.85;font-size:.95rem;line-height:1.5}
.btn{padding:13px 28px;border-radius:999px;border:0;background:linear-gradient(#ffc857,#ff9a1f);color:#3a1500;font:600 1rem Poppins,sans-serif;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 6px 24px #ff9a1f55}
.ghost{background:none;color:var(--gold);border:1px solid #ffc85766;box-shadow:none;font-weight:500;padding:9px 18px;font-size:.85rem}
#nm{transform:scale(.7);transition:transform 1.4s cubic-bezier(.2,1.4,.4,1)}
#fin.show #nm{transform:scale(1)}
.gift{width:100%;margin-top:14px;padding:18px 16px;border-radius:22px;background:linear-gradient(160deg,#ffffff18,#ffffff08);border:1px solid #ffc85744;display:flex;flex-direction:column;align-items:center;gap:10px}
.gift h3{font-weight:600;font-size:1.25rem;color:var(--gold)}
#aura{font-weight:600;font-size:1rem;min-height:2.6em;display:flex;align-items:center;justify-content:center;transition:color .3s}
#aura.neg{color:#ff7a7a}#aura.pos{color:#8ff0a4}#aura.max{color:#ffd24d}
#amt{font-size:2rem;font-weight:600}
input[type=range]{width:100%;accent-color:#ffb020}
#chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#chips button{padding:6px 12px;border-radius:999px;border:1px solid #ffc85755;background:#ffffff10;color:var(--text);font:500 .85rem Poppins,sans-serif;cursor:pointer}
#qr{background:#fff;padding:10px;border-radius:14px;line-height:0;min-height:188px;min-width:188px}
#upi{font-size:.8rem;opacity:.7}
#mk{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
#mk input{padding:10px 14px;border-radius:999px;border:1px solid #ffc85766;background:#ffffff14;color:var(--text);font:inherit;width:170px;outline:none}
.sp{position:fixed;width:7px;height:7px;border-radius:50%;z-index:6;pointer-events:none;animation:fly 1.7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.pn{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.neg{color:#ff7a7a}.pos{color:#8ff0a4}.max{color:#ffd24d}
.aur{font-weight:600;font-size:1.05rem}
.tiny{font-size:.75rem;opacity:.7}
.row{display:flex;gap:8px;width:100%;justify-content:center}
.row input{padding:10px 14px;border-radius:999px;border:1px solid #ffc85766;background:#ffffff14;color:var(--text);font:inherit;width:170px;outline:none}
#chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
#chips button{padding:16px 0;font-size:1.15rem;border-radius:16px}
.emo{font-size:6rem;line-height:1;filter:drop-shadow(0 0 22px #ffb02088)}
.emo.bomb{animation:shk .12s infinite}
@keyframes shk{25%{transform:translate(-4px,2px) rotate(-6deg)}75%{transform:translate(4px,-2px) rotate(6deg)}}
.emo.boom{animation:bm .7s ease-out}
@keyframes bm{from{transform:scale(.3)}60%{transform:scale(1.5)}to{transform:scale(1)}}
.emo.jodi{animation:bt 1s ease-in-out infinite alternate}
@keyframes bt{to{transform:scale(1.18)}}
.emo.grand{animation:bm 1s ease-out}
.ht{position:fixed;bottom:-40px;z-index:6;pointer-events:none;animation:rise 3.2s ease-in forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:9;width:40px;height:40px;border-radius:50%;border:1px solid #ffc85755;background:#ffffff14;color:#fff;font-size:1.1rem;cursor:pointer}
#sig{width:210px;height:250px}
#sig .rg{fill:none;stroke:#ffc857;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ar 2s ease-out infinite}
@keyframes ar{from{transform:scale(.6);opacity:.9}to{transform:scale(1.5);opacity:0}}
#sb{margin-top:14px;font-size:1rem;padding:11px 26px}
.bn{animation:bn .8s ease-in-out infinite alternate}
@keyframes bn{to{transform:translateY(-8px)}}
</style>
</head>
<body>
<div id="stars"></div><div id="moon"></div><button id="mu" aria-label="Music">🔇</button><div id="warm"></div>

<div id="top"><div id="hint" class="serif">Light the diya</div><div id="sub">Make a wish</div><div id="dots"><b></b><b></b><b></b></div><button id="sb" class="btn">Tap</button></div>

<svg id="stage" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
  <defs><radialGradient id="fg"><stop offset="0" stop-color="#fff6c0"/><stop offset="1" stop-color="#ff7a00"/></radialGradient></defs>
  <polygon points="40,260 200,170 360,260" fill="#1d1540"/>
  <circle cx="200" cy="228" r="9" class="win"/>
  <rect x="60" y="260" width="280" height="200" fill="#241a4d"/>
  <path class="win" d="M90 347V310a26 26 0 0 1 52 0V347Z"/>
  <path class="win" d="M258 347V310a26 26 0 0 1 52 0V347Z"/>
  <path class="win" d="M175 460V395a25 25 0 0 1 50 0V460Z"/>
  <rect x="0" y="460" width="400" height="140" fill="#160e33"/>
  <path id="str" d="M40 262Q120 304 200 264T360 262" stroke="#ffffff22" fill="none"/>
  <g id="bulbs"></g>
  <g transform="translate(200 535) scale(1.2 .42)"><g id="rangoli" class="tap"></g></g>
  <g id="diya" class="tap"></g>
  <g id="tb" style="display:none;pointer-events:none"><g class="bn"><rect x="-34" y="-14" width="68" height="28" rx="14" fill="#ffc857"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#3a1500" font-family="Poppins,sans-serif">TAP</text></g></g>
  <g id="lanternWrap" class="tap">
    <line x1="200" y1="0" x2="200" y2="78" stroke="#ffc857" stroke-width="2"/>
    <g id="lantern">
      <rect x="184" y="76" width="32" height="10" rx="3" fill="#ffc857"/>
      <rect x="170" y="86" width="60" height="78" rx="22" fill="#d62d20"/>
      <rect x="170" y="86" width="60" height="78" rx="22" fill="none" stroke="#ffc857" stroke-width="3"/>
      <path d="M185 88v74M200 86v78M215 88v74" stroke="#ffc85777" stroke-width="2" fill="none"/>
      <rect x="184" y="164" width="32" height="9" rx="3" fill="#ffc857"/>
      <path d="M200 173v24" stroke="#ffc857" stroke-width="3"/>
    </g>
  </g>
</svg>

<div id="intro" class="ov show"><div class="card">
  <div class="eye">A little light for you</div>
  <div id="who" class="big serif"></div>
  <p class="msg">I made you something small this Diwali. Three taps, a little magic.</p>
  <button id="go" class="btn">Begin</button>
</div></div>

<div id="fin" class="ov"><div class="card">
  <div id="p1" class="pn">
    <div class="eye">Happy Diwali</div>
    <div id="nm" class="big serif"></div>
    <p class="msg">May your home glow with light, love and endless joy.</p>
    <div class="gift">
      <h3 class="serif">Choose your shagun</h3>
      <div id="chips"></div>
      <div class="row"><input id="cu" type="number" inputmode="numeric" min="10" max="2000" placeholder="Or type 10 to 2000"><button id="cg" class="btn ghost">Go</button></div>
      <div class="tiny">₹10-49 💣 &nbsp;·&nbsp; ₹50-99 💞 &nbsp;·&nbsp; ₹100+ 🎆</div>
    </div>
  </div>

    <div class="eye">Your reward</div>
    <div id="re_e" class="emo"></div>

    <div id="re_t" class="big serif"></div>
    <p id="re_m" class="msg"></p>
    <div id="re_a" class="aur"></div>
    <button id="payb" class="btn">Pay</button>
    <button id="back1" class="btn ghost">Change amount</button>
  </div>
  <div id="p3" class="pn" style="display:none">

  var SONG='',ac=null,mOn=false,tm=null,au=null; /* SONG: put your own audio file path, e.g. 'song.mp3' */
  function startMusic(){
    if(mOn)return;mOn=true;$('mu').textContent='🔊';
    if(SONG){au=au||new Audio(SONG);au.loop=true;au.play().catch(function(){});return}
    try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){return}
    var f=[261.6,277.2,329.6,349.2,392,415.3,493.9,523.3],q=[0,2,3,4,3,2,1,0,2,4,5,4,3,2,3,2,1,0,1,2,0,-1,0,0],n=0;
    function nt(fr,t,d,ty,g){var o=ac.createOscillator(),v=ac.createGain();o.type=ty;o.frequency.value=fr;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.03);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
    function tick(){if(!mOn)return;var t=ac.currentTime+.05,k=q[n%q.length];if(k>=0)nt(f[k],t,.7,'triangle',.12);if(n%8===0){nt(130.8,t,3.4,'sine',.07);nt(196,t,3.4,'sine',.05)}n++}
    tick();tm=setInterval(tick,420)}
